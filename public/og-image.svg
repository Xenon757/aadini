<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a202c"/>
      <stop offset="100%" stop-color="#232d3f"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="315" x2="1200" y2="315" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Top label -->
  <text
    x="600"
    y="115"
    font-family="'Arial Black', Arial, sans-serif"
    font-size="22"
    font-weight="900"
    fill="#00f5d4"
    text-anchor="middle"
    letter-spacing="4"
  >MODULOS: YOUR PERSONAL DEBT MANAGEMENT COMPANION</text>

  <!-- Main headline line 1 -->
  <text
    x="600"
    y="240"
    font-family="'Arial Black', Arial, sans-serif"
    font-size="110"
    font-weight="900"
    fill="#e2e8f0"
    text-anchor="middle"
  >Take Control of</text>

  <!-- Main headline line 2 (accent color) -->
  <text
    x="600"
    y="370"
    font-family="'Arial Black', Arial, sans-serif"
    font-size="110"
    font-weight="900"
    fill="#00f5d4"
    text-anchor="middle"
  >Your Loans.</text>

  <!-- Subheading line 1 -->
  <text
    x="600"
    y="465"
    font-family="Arial, sans-serif"
    font-size="32"
    font-weight="400"
    fill="#a0aec0"
    text-anchor="middle"
  >Instantly see if a loan is affordable and build a smart payoff</text>

  <!-- Subheading line 2 -->
  <text
    x="600"
    y="510"
    font-family="Arial, sans-serif"
    font-size="32"
    font-weight="400"
    fill="#a0aec0"
    text-anchor="middle"
  >plan — no bank login required.</text>
</svg>
